[workspace]
resolver = "2"
members = [
    "crates/packset-core",
    "crates/packset-client",
    "crates/packset-milli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order so a record written by the other writer round-trips with its
# fields in the order that writer put them.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
